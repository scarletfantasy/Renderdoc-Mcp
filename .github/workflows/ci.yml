name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked --group dev --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -q

  quality:
    name: Quality
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync --locked --group dev --python 3.14
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy
      - run: uv pip check
      - run: uv run --no-sync pytest -q --cov=renderdoc_mcp --cov-report=term-missing --cov-fail-under=65
      - run: uv build
